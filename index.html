<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백룸 탈출 게임</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        #squidCount {
            margin-bottom: 15px;
            font-weight: bold;
        }
        #skillCooldown {
            color: #ffff00;
            font-size: 14px;
        }
        #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }
        #endScreen.show {
            display: flex;
        }
        #endText {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="ui">
        <div id="squidCount">오징어: 0/4</div>
        <div id="skillCooldown">스킬 준비됨 (F 키)</div>
    </div>
    <div id="instructions">
        WASD: 이동 | ↑↓←→: 시야 조종 | F: 방구 스킬
    </div>
    <div id="endScreen">
        <div id="endText">[[탈출 축하]]</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Sunset of Seven Suns.mp3" type="audio/mpeg">
    </audio>
    <audio id="dangerMusic" loop>
        <source src="THE WORLD REVOLVING.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME STATE ====================
        const gameState = {
            squidCount: 0,
            totalSquids: 4,
            gameEnded: false,
            skillCooldown: 0,
            skillMaxCooldown: 15,
            monkeyStunned: false,
            monkeyStubbedUntil: 0
        };

        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        scene.fog = new THREE.Fog(0x2a2a2a, 150, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // ==================== PLAYER & CAMERA ====================
        const playerSpeed = 0.2;
        const playerHeight = 1.7;
        let playerPos = new THREE.Vector3(0, playerHeight, 5);
        camera.position.copy(playerPos);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let pitch = 0, yaw = 0;
        const maxPitch = Math.PI / 2;
        const arrowSensitivity = 0.03;
        const playerRadius = 0.5;

        function isColliding(pos) {
            for (let wall of wallColliders) {
                const dx = Math.abs(pos.x - wall.pos.x);
                const dz = Math.abs(pos.z - wall.pos.z);
                if (dx < wall.size.x / 2 + playerRadius && dz < wall.size.z / 2 + playerRadius) {
                    return true;
                }
            }
            return false;
        }

        function updateCameraRotation() {
            if (keys['arrowup']) pitch -= arrowSensitivity;
            if (keys['arrowdown']) pitch += arrowSensitivity;
            if (keys['arrowleft']) yaw += arrowSensitivity;
            if (keys['arrowright']) yaw -= arrowSensitivity;
            pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

            const direction = new THREE.Vector3();
            direction.x = Math.sin(yaw);
            direction.y = Math.sin(pitch);
            direction.z = Math.cos(yaw);
            direction.normalize();

            const right = new THREE.Vector3();
            right.x = Math.cos(yaw);
            right.y = 0;
            right.z = -Math.sin(yaw);
            right.normalize();

            const moveDir = new THREE.Vector3();
            if (keys['w']) moveDir.addScaledVector(direction, playerSpeed);
            if (keys['s']) moveDir.addScaledVector(direction, -playerSpeed);
            if (keys['a']) moveDir.addScaledVector(right, -playerSpeed);
            if (keys['d']) moveDir.addScaledVector(right, playerSpeed);

            const newPos = playerPos.clone().add(moveDir);
            if (!isColliding(newPos)) {
                playerPos.add(moveDir);
            }
            playerPos.y = playerHeight;

            camera.position.copy(playerPos);
            camera.lookAt(playerPos.clone().add(direction.multiplyScalar(10)));
        }

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // ==================== MAZE GENERATION ====================
        let wallColliders = [];
        function createMaze() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ceiling
            const ceilingGeo = new THREE.PlaneGeometry(200, 200);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 12;
            ceiling.receiveShadow = true;
            scene.add(ceiling);

            // Walls (Dark Tan/Brown color)
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
            const wallH = 8;

            const wallPositions = [
                // Perimeter walls
                [-60, 0, -60, 10, wallH], [-60, 0, 0, 10, wallH], [-60, 0, 60, 10, wallH],
                [60, 0, -60, 10, wallH], [60, 0, 0, 10, wallH], [60, 0, 60, 10, wallH],
                [-60, 0, -60, 120, wallH], [-60, 0, 60, 120, wallH],
                [60, 0, -60, 120, wallH], [60, 0, 60, 120, wallH],
                // Internal maze walls
                [-30, 0, -40, 20, wallH], [30, 0, -40, 20, wallH],
                [-40, 0, -20, 20, wallH], [40, 0, -20, 20, wallH],
                [-30, 0, 0, 20, wallH], [30, 0, 0, 20, wallH],
                [-40, 0, 20, 20, wallH], [40, 0, 20, wallH],
                [-30, 0, 40, 20, wallH], [30, 0, 40, 20, wallH],
                [0, 0, -50, 20, wallH], [0, 0, 30, 20, wallH],
                [-50, 0, 10, 20, wallH], [50, 0, 10, 20, wallH],
                [-15, 0, -25, 15, wallH], [15, 0, -25, 15, wallH],
                [-20, 0, 15, 15, wallH], [20, 0, 15, 15, wallH]
            ];

            wallPositions.forEach(([x, y, z, w, h]) => {
                const wallGeo = new THREE.BoxGeometry(w, h, 2);
                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                wall.position.set(x, y + h / 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                wallColliders.push({ pos: new THREE.Vector3(x, y + h / 2, z), size: new THREE.Vector3(w, h, 2) });
            });
        }
        createMaze();

        // ==================== SPAWN POINT & SAFE ZONE ====================
        const spawnPoint = new THREE.Vector3(0, playerHeight, 5);
        const safeZoneRadius = 8;

        // ==================== DOOR ====================
        let doorDestroyed = false;
        const doorPos = new THREE.Vector3(-55, 2.5, 0);
        let doorGroup = new THREE.Group();
        let doorMarker = null;

        function createDoor() {
            const doorGeo = new THREE.BoxGeometry(2.5, 3.5, 0.3);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x808080 });
            const doorMesh = new THREE.Mesh(doorGeo, doorMat);
            doorMesh.castShadow = true;
            doorMesh.receiveShadow = true;
            doorGroup.add(doorMesh);
            doorGroup.position.copy(doorPos);
            scene.add(doorGroup);
        }
        createDoor();

        // ==================== SQUIDS (COLLECTIBLES) ====================
        const squids = [];
        const squidPositions = [
            new THREE.Vector3(35, 1, 35),
            new THREE.Vector3(-45, 1, -45),
            new THREE.Vector3(45, 1, -35),
            new THREE.Vector3(-35, 1, 45)
        ];

        function createSquid(pos) {
            const squidGroup = new THREE.Group();

            const bodyGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            squidGroup.add(body);

            for (let i = 0; i < 8; i++) {
                const tentacleCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 0.3, -0.3, Math.sin(i * Math.PI / 4) * 0.3),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 0.4, -0.6, Math.sin(i * Math.PI / 4) * 0.4)
                ]);
                const tentacleGeo = new THREE.TubeGeometry(tentacleCurve, 8, 0.1, 4);
                const tentacle = new THREE.Mesh(tentacleGeo, bodyMat);
                tentacle.position.y = -0.3;
                tentacle.castShadow = true;
                squidGroup.add(tentacle);
            }

            squidGroup.position.copy(pos);
            squidGroup.collected = false;
            scene.add(squidGroup);
            return squidGroup;
        }

        squidPositions.forEach(pos => {
            squids.push(createSquid(pos));
        });

        // ==================== MONKEY ENEMY ====================
        let monkeyPos = new THREE.Vector3(30, 1, -30);
        let monkeyGroup = new THREE.Group();
        let monkeyVelocity = new THREE.Vector3();
        const monkeyRadius = 0.6;

        function createMonkey() {
            // Body
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            monkeyGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.6, 8, 8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = 1.3;
            head.castShadow = true;
            head.receiveShadow = true;
            monkeyGroup.add(head);

            // Eyes
            for (let i = -1; i <= 1; i += 2) {
                const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(i * 0.25, 1.6, 0.45);
                monkeyGroup.add(eye);
            }

            monkeyGroup.position.copy(monkeyPos);
            scene.add(monkeyGroup);
        }
        createMonkey();

        // ==================== AUDIO ====================
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Resume audio context on user interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });
        document.addEventListener('keydown', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });

        const bgMusicElement = document.getElementById('bgMusic');
        const dangerMusicElement = document.getElementById('dangerMusic');
        let currentMusicType = 'normal';

        bgMusicElement.volume = 0.4;
        dangerMusicElement.volume = 0.4;

        function playBackgroundMusic() {
            dangerMusicElement.pause();
            dangerMusicElement.currentTime = 0;
            bgMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        function playDangerMusic() {
            bgMusicElement.pause();
            bgMusicElement.currentTime = 0;
            dangerMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        // 페이지 로드 후 배경음악 시작
        window.addEventListener('load', () => {
            setTimeout(() => playBackgroundMusic(), 500);
        });

        function playTone(freq, duration, type = 'sine', gain = 0.3) {
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gainNode.gain.setValueAtTime(gain, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function playSwoosh() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playExplosion() {
            playSwoosh();
            playTone(150, 0.4, 'square', 0.3);
            playTone(100, 0.6, 'sine', 0.2);
        }

        function playMonkeyScream() {
            playTone(800, 0.3, 'sine', 0.4);
            playTone(600, 0.3, 'sine', 0.3);
        }

        function playFart() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playGroan() {
            playTone(120, 0.6, 'sine', 0.2);
        }

        // ==================== SKILL SYSTEM ====================
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f' && gameState.skillCooldown <= 0 && !gameState.gameEnded) {
                playExplosion();
                playFart();
                setTimeout(playGroan, 400);

                gameState.skillCooldown = gameState.skillMaxCooldown;

                // Stun nearby monkey
                const distToMonkey = playerPos.distanceTo(monkeyPos);
                if (distToMonkey < 20) {
                    gameState.monkeyStunned = true;
                    gameState.monkeyStubbedUntil = Date.now() + 6000;
                    playMonkeyScream();
                }
            }
        });

        // ==================== GAME LOOP ====================
        function animate() {
            requestAnimationFrame(animate);

            // Update camera rotation
            updateCameraRotation();

            // Update skill cooldown
            if (gameState.skillCooldown > 0) {
                gameState.skillCooldown -= 0.016;
            }

            // Update UI
            document.getElementById('squidCount').textContent = `오징어: ${gameState.squidCount}/4`;
            if (gameState.skillCooldown <= 0) {
                document.getElementById('skillCooldown').textContent = '스킬 준비됨 (F 키)';
                document.getElementById('skillCooldown').style.color = '#00ff00';
            } else {
                document.getElementById('skillCooldown').textContent = `스킬 쿨타임: ${gameState.skillCooldown.toFixed(1)}s`;
                document.getElementById('skillCooldown').style.color = '#ffff00';
            }

            // Check stun status
            if (gameState.monkeyStunned && Date.now() > gameState.monkeyStubbedUntil) {
                gameState.monkeyStunned = false;
            }

            // Squid collection
            squids.forEach((squid, idx) => {
                if (!squid.collected) {
                    squid.rotation.y += 0.02;
                    squid.position.y += Math.sin(Date.now() * 0.003) * 0.01;

                    const distToPlayer = playerPos.distanceTo(squid.position);
                    if (distToPlayer < 3) {
                        squid.collected = true;
                        gameState.squidCount++;
                        scene.remove(squid);
                    }
                }
            });

            // Monkey AI
            if (!gameState.monkeyStunned) {
                const dirToPlayer = new THREE.Vector3();
                dirToPlayer.subVectors(playerPos, monkeyPos).normalize();
                monkeyVelocity.copy(dirToPlayer).multiplyScalar(0.12);
            } else {
                monkeyVelocity.multiplyScalar(0.95);
            }

            const newMonkeyPos = monkeyPos.clone().add(monkeyVelocity);
            let canMove = true;
            for (let wall of wallColliders) {
                const dx = Math.abs(newMonkeyPos.x - wall.pos.x);
                const dz = Math.abs(newMonkeyPos.z - wall.pos.z);
                if (dx < wall.size.x / 2 + monkeyRadius && dz < wall.size.z / 2 + monkeyRadius) {
                    canMove = false;
                    break;
                }
            }

            if (canMove) {
                monkeyPos.add(monkeyVelocity);
            }

            monkeyPos.y = 1;
            monkeyGroup.position.copy(monkeyPos);

            // Make monkey look at player
            const dirToPlayerForLook = playerPos.clone().sub(monkeyPos);
            monkeyGroup.lookAt(monkeyPos.clone().add(dirToPlayerForLook));

            // Collision with monkey
            const distToMonkey = playerPos.distanceTo(monkeyPos);
            if (distToMonkey < 2) {
                playerPos.copy(spawnPoint);
                camera.position.copy(playerPos);
            }

            // Safe zone (can't take damage here)
            const distToSpawn = playerPos.distanceTo(spawnPoint);
            if (distToSpawn < safeZoneRadius && distToMonkey < 2) {
                // Monkey bounces back
                const bounceDir = new THREE.Vector3();
                bounceDir.subVectors(monkeyPos, playerPos).normalize();
                monkeyPos.addScaledVector(bounceDir, 3);
            }

            // Door marker when all squids collected
            if (gameState.squidCount === 4 && !doorMarker && !doorDestroyed) {
                const markerGeo = new THREE.SphereGeometry(0.4, 16, 16);
                const markerMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });
                doorMarker = new THREE.Mesh(markerGeo, markerMat);
                doorMarker.position.copy(doorPos);
                doorMarker.position.y = 3.5;
                scene.add(doorMarker);
            }

            // Door destruction
            if (gameState.squidCount === 4 && playerPos.distanceTo(doorPos) < 3 && !doorDestroyed && !gameState.gameEnded) {
                doorDestroyed = true;
                gameState.gameEnded = true;
                playExplosion();
                playGroan();

                // Animate door destruction
                setTimeout(() => {
                    scene.remove(doorGroup);
                    if (doorMarker) scene.remove(doorMarker);
                    document.getElementById('endScreen').classList.add('show');
                }, 500);

                // Fade screen to black
                const fadeDiv = document.createElement('div');
                fadeDiv.style.position = 'fixed';
                fadeDiv.style.top = '0';
                fadeDiv.style.left = '0';
                fadeDiv.style.width = '100%';
                fadeDiv.style.height = '100%';
                fadeDiv.style.background = 'rgba(0, 0, 0, 0)';
                fadeDiv.style.zIndex = '99';
                fadeDiv.style.transition = 'background 0.5s ease-out';
                document.body.appendChild(fadeDiv);
                setTimeout(() => {
                    fadeDiv.style.background = 'rgba(0, 0, 0, 0.95)';
                }, 10);
            }

            // Update music based on threat level
            const monkeyDist = playerPos.distanceTo(monkeyPos);
            const isInDanger = monkeyDist < 25 && distToSpawn > safeZoneRadius;

            if (isInDanger && currentMusicType === 'normal') {
                currentMusicType = 'danger';
                playDangerMusic();
            } else if (!isInDanger && currentMusicType === 'danger') {
                currentMusicType = 'normal';
                playBackgroundMusic();
            }

            renderer.render(scene, camera);
        }

        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
