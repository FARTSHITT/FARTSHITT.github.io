<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백룸 탈출 게임</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        #squidCount {
            margin-bottom: 15px;
            font-weight: bold;
        }
        #gunPartsCount {
            margin-bottom: 10px;
            font-weight: bold;
        }
        #shotCount {
            margin-bottom: 10px;
            font-weight: bold;
        }
        #skillCooldown {
            color: #ffff00;
            font-size: 14px;
            margin-bottom: 10px;
        }
        #dashCooldown {
            color: #00ffff;
            font-size: 14px;
        }
        #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }
        #endScreen.show {
            display: flex;
        }
        #endText {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="ui">
        <div id="gunPartsCount">권총 부품: 0/4</div>
        <div id="shotCount">발사 횟수: 0/20</div>
        <div id="skillCooldown">스킬 준비됨 (F 키)</div>
        <div id="dashCooldown">대쉬 준비됨 (R 키)</div>
    </div>
    <div id="instructions">
        WASD: 이동 | ↑↓←→: 시야 조종 | F: 스턴 | R: 대쉬 | 클릭: 발사
    </div>
    <div id="endScreen">
        <div id="endText">[[탈출 축하]]</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Sunset of Seven Suns.mp3" type="audio/mpeg">
    </audio>
    <audio id="dangerMusic" loop>
        <source src="THE WORLD REVOLVING.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME STATE ====================
        const gameState = {
            gunPartsCount: 0,
            totalGunParts: 4,
            gameEnded: false,
            skillCooldown: 0,
            skillMaxCooldown: 15,
            dashCooldown: 0,
            dashMaxCooldown: 2,
            isDashing: false,
            monkeyStunned: false,
            monkeyStubbedUntil: 0,
            monkeyHealth: 3,
            monkeyDefeated: false,
            bossActive: false,
            shotCount: 0,
            maxShots: 20,
            canShoot: false,
            dashUnlocked: false
        };

        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        scene.fog = new THREE.Fog(0x2a2a2a, 200, 700);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // ==================== PLAYER & CAMERA ====================
        const playerSpeed = 0.2;
        const playerHeight = 1.7;
        let playerPos = new THREE.Vector3(0, playerHeight, 5);
        camera.position.copy(playerPos);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let pitch = 0, yaw = 0;
        const maxPitch = Math.PI / 2;
        const arrowSensitivity = 0.03;
        const playerRadius = 0.5;

        function isColliding(pos) {
            for (let wall of wallColliders) {
                const dx = Math.abs(pos.x - wall.pos.x);
                const dz = Math.abs(pos.z - wall.pos.z);
                if (dx < wall.size.x / 2 + playerRadius && dz < wall.size.z / 2 + playerRadius) {
                    return true;
                }
            }
            return false;
        }

        function updateCameraRotation() {
            if (keys['arrowup']) pitch -= arrowSensitivity;
            if (keys['arrowdown']) pitch += arrowSensitivity;
            if (keys['arrowleft']) yaw += arrowSensitivity;
            if (keys['arrowright']) yaw -= arrowSensitivity;
            pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

            const direction = new THREE.Vector3();
            direction.x = Math.sin(yaw);
            direction.y = Math.sin(pitch);
            direction.z = Math.cos(yaw);
            direction.normalize();

            const right = new THREE.Vector3();
            right.x = Math.cos(yaw);
            right.y = 0;
            right.z = -Math.sin(yaw);
            right.normalize();

            const moveDir = new THREE.Vector3();
            if (keys['w']) moveDir.addScaledVector(direction, playerSpeed);
            if (keys['s']) moveDir.addScaledVector(direction, -playerSpeed);
            if (keys['a']) moveDir.addScaledVector(right, -playerSpeed);
            if (keys['d']) moveDir.addScaledVector(right, playerSpeed);

            const newPos = playerPos.clone().add(moveDir);
            if (!isColliding(newPos)) {
                playerPos.add(moveDir);
            }
            playerPos.y = playerHeight;

            camera.position.copy(playerPos);
            camera.lookAt(playerPos.clone().add(direction.multiplyScalar(10)));
        }

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // ==================== MAZE GENERATION ====================
        let wallColliders = [];
        function createMaze() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(400, 400);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ceiling
            const ceilingGeo = new THREE.PlaneGeometry(400, 400);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 12;
            ceiling.receiveShadow = true;
            scene.add(ceiling);

            // Walls (Dark Tan/Brown color)
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
            const wallH = 8;

            const wallPositions = [
                // Perimeter walls
                [-100, 0, -100, 20, wallH], [-100, 0, -50, 20, wallH], [-100, 0, 0, 20, wallH],
                [-100, 0, 50, 20, wallH], [-100, 0, 100, 20, wallH],
                [100, 0, -100, 20, wallH], [100, 0, -50, 20, wallH], [100, 0, 0, 20, wallH],
                [100, 0, 50, 20, wallH], [100, 0, 100, 20, wallH],
                [-100, 0, -100, 200, wallH], [-100, 0, 100, 200, wallH],
                [100, 0, -100, 200, wallH], [100, 0, 100, 200, wallH],
                // Internal maze walls
                [-50, 0, -60, 30, wallH], [50, 0, -60, 30, wallH],
                [-60, 0, -30, 30, wallH], [60, 0, -30, 30, wallH],
                [-50, 0, 0, 30, wallH], [50, 0, 0, 30, wallH],
                [-60, 0, 30, 30, wallH], [60, 0, 30, wallH],
                [-50, 0, 60, 30, wallH], [50, 0, 60, 30, wallH],
                [0, 0, -80, 30, wallH], [0, 0, 50, 30, wallH],
                [-80, 0, 10, 30, wallH], [80, 0, 10, 30, wallH]
            ];

            wallPositions.forEach(([x, y, z, w, h]) => {
                const wallGeo = new THREE.BoxGeometry(w, h, 2);
                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                wall.position.set(x, y + h / 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                wallColliders.push({ pos: new THREE.Vector3(x, y + h / 2, z), size: new THREE.Vector3(w, h, 2) });
            });
        }
        createMaze();

        // ==================== SPAWN POINT & SAFE ZONE ====================
        const spawnPoint = new THREE.Vector3(0, playerHeight, 5);
        const safeZoneRadius = 8;

        // ==================== DOOR ====================
        let doorDestroyed = false;
        const doorPos = new THREE.Vector3(-55, 2.5, 0);
        let doorGroup = new THREE.Group();
        let doorMarker = null;

        function createDoor() {
            const doorGeo = new THREE.BoxGeometry(2.5, 3.5, 0.3);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x808080 });
            const doorMesh = new THREE.Mesh(doorGeo, doorMat);
            doorMesh.castShadow = true;
            doorMesh.receiveShadow = true;
            doorGroup.add(doorMesh);
            doorGroup.position.copy(doorPos);
            scene.add(doorGroup);
        }
        createDoor();

        // ==================== GUN PARTS (COLLECTIBLES) ====================
        const gunParts = [];
        const gunPartPositions = [
            new THREE.Vector3(70, 1, 70),
            new THREE.Vector3(-80, 1, -80),
            new THREE.Vector3(80, 1, -70),
            new THREE.Vector3(-70, 1, 80)
        ];

        function createGunPart(pos) {
            const partGroup = new THREE.Group();
            const partMat = new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xff4500, emissiveIntensity: 0.3 });

            const barrelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 12);
            const barrel = new THREE.Mesh(barrelGeo, partMat);
            barrel.position.z = 0.4;
            barrel.castShadow = true;
            partGroup.add(barrel);

            const gripGeo = new THREE.BoxGeometry(0.3, 0.6, 0.3);
            const grip = new THREE.Mesh(gripGeo, partMat);
            grip.position.z = -0.3;
            grip.castShadow = true;
            partGroup.add(grip);

            const triggerGeo = new THREE.BoxGeometry(0.1, 0.2, 0.1);
            const trigger = new THREE.Mesh(triggerGeo, partMat);
            trigger.position.set(0, -0.15, -0.2);
            trigger.castShadow = true;
            partGroup.add(trigger);

            partGroup.position.copy(pos);
            partGroup.collected = false;
            scene.add(partGroup);
            return partGroup;
        }

        gunPartPositions.forEach(pos => {
            gunParts.push(createGunPart(pos));
        });

        // ==================== DASH SKILL ZONE ====================
        const dashZonePos = new THREE.Vector3(-90, 0.5, -90);
        const dashZoneGeo = new THREE.BoxGeometry(3, 1, 3);
        const dashZoneMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });
        const dashZone = new THREE.Mesh(dashZoneGeo, dashZoneMat);
        dashZone.position.copy(dashZonePos);
        dashZone.receiveShadow = true;
        scene.add(dashZone);

        // ==================== MONKEY ENEMY ====================
        let monkeyPos = new THREE.Vector3(50, 1, -50);
        let monkeyGroup = new THREE.Group();
        let monkeyVelocity = new THREE.Vector3();
        const monkeyRadius = 0.6;

        function createMonkey() {
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            monkeyGroup.add(body);

            const headGeo = new THREE.SphereGeometry(0.6, 8, 8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = 1.3;
            head.castShadow = true;
            head.receiveShadow = true;
            monkeyGroup.add(head);

            for (let i = -1; i <= 1; i += 2) {
                const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(i * 0.25, 1.6, 0.45);
                monkeyGroup.add(eye);
            }

            monkeyGroup.position.copy(monkeyPos);
            scene.add(monkeyGroup);
        }
        createMonkey();

        // ==================== BOSS SQUID ====================
        let bossPos = new THREE.Vector3(0, 3, 0);
        let bossGroup = new THREE.Group();
        let bossVelocity = new THREE.Vector3();
        const bossRadius = 1.5;
        let bossStunned = false;
        let bossStubbedUntil = 0;

        function createBossSquid() {
            const bodyGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff1493, emissive: 0xff1493, emissiveIntensity: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            bossGroup.add(body);

            for (let i = 0; i < 10; i++) {
                const tentacleCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 5) * 0.6, -0.5, Math.sin(i * Math.PI / 5) * 0.6),
                    new THREE.Vector3(Math.cos(i * Math.PI / 5) * 1, -1.2, Math.sin(i * Math.PI / 5) * 1)
                ]);
                const tentacleGeo = new THREE.TubeGeometry(tentacleCurve, 10, 0.2, 4);
                const tentacle = new THREE.Mesh(tentacleGeo, bodyMat);
                tentacle.castShadow = true;
                bossGroup.add(tentacle);
            }

            bossGroup.position.copy(bossPos);
            scene.add(bossGroup);
        }

        // ==================== AUDIO ====================
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Resume audio context on user interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });
        document.addEventListener('keydown', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });

        const bgMusicElement = document.getElementById('bgMusic');
        const dangerMusicElement = document.getElementById('dangerMusic');
        let currentMusicType = 'normal';

        bgMusicElement.volume = 0.4;
        dangerMusicElement.volume = 0.4;

        function playBackgroundMusic() {
            dangerMusicElement.pause();
            dangerMusicElement.currentTime = 0;
            bgMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        function playDangerMusic() {
            bgMusicElement.pause();
            bgMusicElement.currentTime = 0;
            dangerMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        // 페이지 로드 후 배경음악 시작
        window.addEventListener('load', () => {
            setTimeout(() => playBackgroundMusic(), 500);
        });

        function playTone(freq, duration, type = 'sine', gain = 0.3) {
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gainNode.gain.setValueAtTime(gain, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function playSwoosh() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playExplosion() {
            playSwoosh();
            playTone(150, 0.4, 'square', 0.3);
            playTone(100, 0.6, 'sine', 0.2);
        }

        function playMonkeyScream() {
            playTone(800, 0.3, 'sine', 0.4);
            playTone(600, 0.3, 'sine', 0.3);
        }

        function playFart() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playGroan() {
            playTone(120, 0.6, 'sine', 0.2);
        }

        // ==================== RAYCASTING ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ==================== SKILL SYSTEM ====================
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key === 'f' && gameState.skillCooldown <= 0 && !gameState.gameEnded) {
                gameState.skillCooldown = gameState.skillMaxCooldown;

                if (!gameState.monkeyDefeated) {
                    gameState.monkeyStunned = true;
                    gameState.monkeyStubbedUntil = Date.now() + 6000;
                }
                if (gameState.bossActive) {
                    bossStunned = true;
                    bossStubbedUntil = Date.now() + 6000;
                }
            }

            if (key === 'r' && gameState.dashCooldown <= 0 && gameState.dashUnlocked && !gameState.gameEnded) {
                gameState.dashCooldown = gameState.dashMaxCooldown;
                gameState.isDashing = true;

                const direction = new THREE.Vector3();
                direction.x = Math.sin(yaw);
                direction.y = Math.sin(pitch);
                direction.z = Math.cos(yaw);
                direction.normalize();

                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        if (gameState.isDashing) {
                            playerPos.addScaledVector(direction, 0.5);
                        }
                    }, i * 16);
                }

                setTimeout(() => {
                    gameState.isDashing = false;
                }, 160);
            }
        });

        window.addEventListener('click', (event) => {
            if (!gameState.canShoot || gameState.gameEnded) return;

            const direction = new THREE.Vector3();
            direction.x = Math.sin(yaw);
            direction.y = Math.sin(pitch);
            direction.z = Math.cos(yaw);
            direction.normalize();

            if (!gameState.monkeyDefeated) {
                const distToMonkey = playerPos.distanceTo(monkeyPos);
                const dirToMonkey = monkeyPos.clone().sub(playerPos).normalize();
                const dotProduct = direction.dot(dirToMonkey);
                const angle = Math.acos(Math.max(-1, Math.min(1, dotProduct)));

                if (angle < 0.4 && distToMonkey < 120) {
                    gameState.monkeyHealth--;
                    gameState.shotCount++;
                    if (gameState.monkeyHealth <= 0) {
                        gameState.monkeyDefeated = true;
                        scene.remove(monkeyGroup);
                        createBossSquid();
                        gameState.bossActive = true;
                    }
                }
            } else if (gameState.bossActive) {
                gameState.shotCount++;
                const distToBoss = playerPos.distanceTo(bossPos);
                const dirToBoss = bossPos.clone().sub(playerPos).normalize();
                const dotProduct = direction.dot(dirToBoss);
                const angle = Math.acos(Math.max(-1, Math.min(1, dotProduct)));

                if (gameState.shotCount >= gameState.maxShots) {
                    gameState.gameEnded = true;
                    showCredits();
                }
            }
        });

        // ==================== SHOW CREDITS ====================
        function showCredits() {
            const creditText = document.getElementById('endText');
            creditText.innerHTML = `크레딧<br><br>이승준<br>김종민<br>Claude AI`;
            document.getElementById('endScreen').classList.add('show');

            setTimeout(() => {
                const explosionContainer = document.createElement('div');
                explosionContainer.style.position = 'fixed';
                explosionContainer.style.top = '0';
                explosionContainer.style.left = '0';
                explosionContainer.style.width = '100%';
                explosionContainer.style.height = '100%';
                explosionContainer.style.fontSize = '200px';
                explosionContainer.style.display = 'flex';
                explosionContainer.style.justifyContent = 'center';
                explosionContainer.style.alignItems = 'center';
                explosionContainer.style.zIndex = '101';
                explosionContainer.textContent = '💥';
                explosionContainer.style.animation = 'fade-in 0.5s ease-in-out forwards';
                document.body.appendChild(explosionContainer);

                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fade-in {
                        from { opacity: 0; transform: scale(0.5); }
                        to { opacity: 1; transform: scale(2); }
                    }
                `;
                document.head.appendChild(style);

                setTimeout(() => {
                    window.close();
                }, 670);
            }, 2000);
        }

        // ==================== GAME LOOP ====================
        function animate() {
            requestAnimationFrame(animate);

            if (!gameState.gameEnded) {
                updateCameraRotation();
            }

            // Update cooldowns
            if (gameState.skillCooldown > 0) {
                gameState.skillCooldown -= 0.016;
            }
            if (gameState.dashCooldown > 0) {
                gameState.dashCooldown -= 0.016;
            }

            // Update UI
            document.getElementById('gunPartsCount').textContent = `권총 부품: ${gameState.gunPartsCount}/4`;
            document.getElementById('shotCount').textContent = `발사 횟수: ${gameState.shotCount}/20`;

            if (gameState.skillCooldown <= 0) {
                document.getElementById('skillCooldown').textContent = '스킬 준비됨 (F 키)';
                document.getElementById('skillCooldown').style.color = '#00ff00';
            } else {
                document.getElementById('skillCooldown').textContent = `스킬 쿨타임: ${gameState.skillCooldown.toFixed(1)}s`;
                document.getElementById('skillCooldown').style.color = '#ffff00';
            }

            if (gameState.dashUnlocked) {
                if (gameState.dashCooldown <= 0) {
                    document.getElementById('dashCooldown').textContent = '대쉬 준비됨 (R 키)';
                    document.getElementById('dashCooldown').style.color = '#00ffff';
                } else {
                    document.getElementById('dashCooldown').textContent = `대쉬 쿨타임: ${gameState.dashCooldown.toFixed(1)}s`;
                    document.getElementById('dashCooldown').style.color = '#ffff00';
                }
            } else {
                document.getElementById('dashCooldown').textContent = '대쉬 잠김';
                document.getElementById('dashCooldown').style.color = '#999999';
            }

            // Check stun status
            if (gameState.monkeyStunned && Date.now() > gameState.monkeyStubbedUntil) {
                gameState.monkeyStunned = false;
            }
            if (bossStunned && Date.now() > bossStubbedUntil) {
                bossStunned = false;
            }

            // Gun parts collection
            gunParts.forEach((part, idx) => {
                if (!part.collected) {
                    part.rotation.y += 0.02;
                    part.position.y += Math.sin(Date.now() * 0.003) * 0.01;

                    const distToPlayer = playerPos.distanceTo(part.position);
                    if (distToPlayer < 3) {
                        part.collected = true;
                        gameState.gunPartsCount++;
                        scene.remove(part);
                        if (gameState.gunPartsCount === 4) {
                            gameState.canShoot = true;
                        }
                    }
                }
            });

            // Check dash zone
            const distToDashZone = playerPos.distanceTo(dashZonePos);
            if (distToDashZone < 3 && !gameState.dashUnlocked) {
                gameState.dashUnlocked = true;
            }

            // Monkey AI
            if (!gameState.monkeyDefeated) {
                if (!gameState.monkeyStunned) {
                    const dirToPlayer = new THREE.Vector3();
                    dirToPlayer.subVectors(playerPos, monkeyPos).normalize();
                    monkeyVelocity.copy(dirToPlayer).multiplyScalar(0.15);
                } else {
                    monkeyVelocity.multiplyScalar(0.95);
                }

                const newMonkeyPos = monkeyPos.clone().add(monkeyVelocity);
                let canMove = true;
                for (let wall of wallColliders) {
                    const dx = Math.abs(newMonkeyPos.x - wall.pos.x);
                    const dz = Math.abs(newMonkeyPos.z - wall.pos.z);
                    if (dx < wall.size.x / 2 + monkeyRadius && dz < wall.size.z / 2 + monkeyRadius) {
                        canMove = false;
                        break;
                    }
                }

                if (canMove) {
                    monkeyPos.add(monkeyVelocity);
                }

                monkeyPos.y = 1;
                monkeyGroup.position.copy(monkeyPos);

                const dirToPlayerForLook = playerPos.clone().sub(monkeyPos);
                monkeyGroup.lookAt(monkeyPos.clone().add(dirToPlayerForLook));

                // Collision with monkey
                const distToMonkey = playerPos.distanceTo(monkeyPos);
                if (distToMonkey < 2 && !gameState.isDashing) {
                    playerPos.copy(spawnPoint);
                    camera.position.copy(playerPos);
                }

                // Dash collision with monkey
                if (distToMonkey < 2 && gameState.isDashing) {
                    const knockbackDir = monkeyPos.clone().sub(playerPos).normalize();
                    monkeyPos.addScaledVector(knockbackDir, 5);
                    gameState.monkeyStunned = true;
                    gameState.monkeyStubbedUntil = Date.now() + 2500;
                }
            }

            // Boss AI
            if (gameState.bossActive) {
                if (!bossStunned) {
                    const dirToPlayer = new THREE.Vector3();
                    dirToPlayer.subVectors(playerPos, bossPos).normalize();
                    bossVelocity.copy(dirToPlayer).multiplyScalar(0.08);
                } else {
                    bossVelocity.multiplyScalar(0.95);
                }

                const newBossPos = bossPos.clone().add(bossVelocity);
                let canMove = true;
                for (let wall of wallColliders) {
                    const dx = Math.abs(newBossPos.x - wall.pos.x);
                    const dz = Math.abs(newBossPos.z - wall.pos.z);
                    if (dx < wall.size.x / 2 + bossRadius && dz < wall.size.z / 2 + bossRadius) {
                        canMove = false;
                        break;
                    }
                }

                if (canMove) {
                    bossPos.add(bossVelocity);
                }

                bossPos.y = 3;
                bossGroup.position.copy(bossPos);

                const distToBoss = playerPos.distanceTo(bossPos);
                if (distToBoss < 3 && !gameState.isDashing) {
                    playerPos.copy(spawnPoint);
                    camera.position.copy(playerPos);
                }

                if (distToBoss < 3 && gameState.isDashing) {
                    const knockbackDir = bossPos.clone().sub(playerPos).normalize();
                    bossPos.addScaledVector(knockbackDir, 5);
                    bossStunned = true;
                    bossStubbedUntil = Date.now() + 2500;
                }
            }

            // Update music based on threat level
            let musicDist = 999;
            let isInDanger = false;

            if (!gameState.monkeyDefeated) {
                musicDist = playerPos.distanceTo(monkeyPos);
                isInDanger = musicDist < 40;
            } else if (gameState.bossActive) {
                musicDist = playerPos.distanceTo(bossPos);
                isInDanger = musicDist < 60;
            }

            if (isInDanger && currentMusicType === 'normal') {
                currentMusicType = 'danger';
                playDangerMusic();
            } else if (!isInDanger && currentMusicType === 'danger') {
                currentMusicType = 'normal';
                playBackgroundMusic();
            }

            renderer.render(scene, camera);
        }

        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
