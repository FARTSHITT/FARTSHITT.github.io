<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백룸 탈출 게임</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        #squidCount {
            margin-bottom: 15px;
            font-weight: bold;
        }
        #skillCooldown {
            color: #ffff00;
            font-size: 14px;
        }
        #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }
        #endScreen.show {
            display: flex;
        }
        #endText {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            z-index: 10;
        }
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            font-family: Arial, sans-serif;
        }
        #introScreen.hidden {
            display: none;
        }
        .intro-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }
        .difficulty-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .difficulty-button {
            padding: 15px 30px;
            font-size: 18px;
            border: 2px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .difficulty-button:hover {
            background: white;
            color: black;
        }
        .difficulty-button.active {
            background: white;
            color: black;
        }
        #startButton {
            padding: 15px 40px;
            font-size: 20px;
            border: 2px solid white;
            background: white;
            color: black;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        #startButton:hover {
            background: #ccc;
        }
        #startButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #gunUI {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            cursor: pointer;
            width: 60px;
            height: 60px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #gunUI.visible {
            display: flex;
        }
        #gunIcon {
            width: 100%;
            height: 100%;
            background: #333;
            border: 2px solid #ff6600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ff6600;
            transition: all 0.2s;
        }
        #gunIcon:hover {
            background: #444;
            transform: scale(1.1);
        }
        #messageOverlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            pointer-events: none;
        }
        .message {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            animation: messageAnim 2.8s ease-in-out forwards;
        }
        @keyframes messageAnim {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        #cinemaScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            z-index: 190;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: black;
            font-family: Arial, sans-serif;
        }
        #creditsScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            z-index: 190;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #creditsScreen.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #creditsText {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            animation: scrollCredits 4s ease-in-out forwards;
            white-space: nowrap;
            color: black;
        }
        @keyframes scrollCredits {
            0% { transform: translateY(100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        #explosionScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            z-index: 191;
            overflow: hidden;
            font-size: 80px;
            line-height: 1;
        }
        #explosionScreen.show {
            display: block;
        }
        #explosionContent {
            animation: fillScreen 2s ease-in forwards;
            word-wrap: break-word;
            word-break: break-all;
        }
        @keyframes fillScreen {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #bossHealthBar {
            position: fixed;
            top: 80px;
            left: 20px;
            width: 200px;
            height: 30px;
            background: #333;
            border: 2px solid red;
            z-index: 50;
            display: none;
        }
        #bossHealthBar.show {
            display: block;
        }
        #bossHealthFill {
            height: 100%;
            background: red;
            width: 100%;
            transition: width 0.1s;
        }
        #bossHealthText {
            position: absolute;
            top: 5px;
            left: 10px;
            color: white;
            font-weight: bold;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="ui">
        <div id="squidCount">권총 부품: 0/4</div>
        <div id="skillCooldown">스킬 준비됨 (F 키)</div>
    </div>
    <div id="instructions">
        WASD: 이동 | ↑↓←→: 시야 조종 | F: 방구 스킬
    </div>
    <div id="endScreen">
        <div id="endText">[[탈출 축하]]</div>
    </div>
    <div id="gunUI">
        <div id="gunIcon">🔫</div>
    </div>
    <div id="messageOverlay"></div>
    <div id="creditsScreen">
        <div id="creditsText"></div>
    </div>
    <div id="explosionScreen">
        <div id="explosionContent"></div>
    </div>
    <div id="bossHealthBar">
        <div id="bossHealthFill"></div>
        <div id="bossHealthText">BOSS: 20/20</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="24. Doom Board (DELTARUNE Chapter 3+4 Soundtrack) - Toby Fox.mp3" type="audio/mpeg">
    </audio>
    <audio id="dangerMusic" loop>
        <source src="burning eyes with amen breaks.mp3" type="audio/mpeg">
    </audio>
    <audio id="fartSound">
        <source src="fart-with-reverb.mp3" type="audio/mpeg">
    </audio>
    <audio id="raahSound">
        <source src="raaaah (1).mp3" type="audio/mpeg">
    </audio>
    <audio id="gunShotSound">
        <source src="sound-effect-glock-17-mp3cut.mp3" type="audio/mpeg">
    </audio>
    <audio id="deathSound">
        <source src="lego-yoda-death-scream.mp3" type="audio/mpeg">
    </audio>
    <audio id="assaultMusic" loop>
        <source src="045. NGAHHH!! (UNDERTALE Soundtrack) - Toby Fox.mp3" type="audio/mpeg">
    </audio>
    <audio id="bossDieSound">
        <source src="soepaipeu.mp3" type="audio/mpeg">
    </audio>
    <audio id="dashSound">
        <source src="deltarune-jarona.mp3" type="audio/mpeg">
    </audio>
    <audio id="parrySound">
        <source src="ultrakill-parry.mp3" type="audio/mpeg">
    </audio>
    <audio id="explosionSound">
        <source src="roblox-explosion-sound.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME STATE ====================
        const gameState = {
            squidCount: 0,
            totalSquids: 4,
            gameEnded: false,
            skillCooldown: 0,
            skillMaxCooldown: 15,
            skillRCooldown: 0,
            skillRMaxCooldown: 10,
            monkeyStunned: false,
            monkeyStubbedUntil: 0,
            speedBoostActive: false,
            speedBoostUntil: 0,
            difficulty: 'easy',
            gameStarted: true,
            gunUnlocked: false,
            gunCooldown: 0,
            squidDefeated: false,
            assaultModeActive: false,
            squidRagdollState: null,
            gamePhase: 'intro',
            bossActive: false,
            bossHealth: 20,
            bossInvulnerable: false,
            bossInvulnerableUntil: 0,
            dashUnlocked: false,
            dashCooldown: 0,
            dashMaxCooldown: 2.0,
            dashActive: false,
            dashEndTime: 0,
            creditsActive: false,
            creditScroll: 0
        };

        const difficultySettings = { easy: 1.0, hard: 1.5, extreme: 2.0 };
        let keyObject = null;
        let realKey = null;
        let difficultyMultiplier = 1.0;
        let bossMonkey = null;
        let posterWall = null;
        let dashDamaged = false;
        let monkeyMonkeyStunnedUntil = 0;

        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // ==================== PLAYER & CAMERA ====================
        const playerSpeed = 0.2;
        const playerHeight = 1.7;
        let playerPos = new THREE.Vector3(0, playerHeight, 5);
        camera.position.copy(playerPos);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let pitch = 0, yaw = Math.PI;
        const maxPitch = Math.PI / 2;
        const arrowSensitivity = 0.03;
        const playerRadius = 0.5;

        function isColliding(pos) {
            for (let wall of wallColliders) {
                const dx = Math.abs(pos.x - wall.pos.x);
                const dz = Math.abs(pos.z - wall.pos.z);
                if (dx < wall.size.x / 2 + playerRadius && dz < wall.size.z / 2 + playerRadius) {
                    return true;
                }
            }
            return false;
        }

        function updateCameraRotation() {
            if (keys['arrowup']) pitch -= arrowSensitivity;
            if (keys['arrowdown']) pitch += arrowSensitivity;
            if (keys['arrowleft']) yaw += arrowSensitivity;
            if (keys['arrowright']) yaw -= arrowSensitivity;
            pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

            const direction = new THREE.Vector3();
            direction.x = Math.sin(yaw);
            direction.y = Math.sin(pitch);
            direction.z = Math.cos(yaw);
            direction.normalize();

            const right = new THREE.Vector3();
            right.x = Math.cos(yaw);
            right.y = 0;
            right.z = -Math.sin(yaw);
            right.normalize();

            const currentSpeed = gameState.speedBoostActive ? playerSpeed * 2 : playerSpeed;
            const moveDir = new THREE.Vector3();
            if (keys['w']) moveDir.addScaledVector(direction, currentSpeed);
            if (keys['s']) moveDir.addScaledVector(direction, -currentSpeed);
            if (keys['a']) moveDir.addScaledVector(right, -currentSpeed);
            if (keys['d']) moveDir.addScaledVector(right, currentSpeed);

            const newPos = playerPos.clone().add(moveDir);
            if (!isColliding(newPos)) {
                playerPos.add(moveDir);
            }
            playerPos.y = playerHeight;

            camera.position.copy(playerPos);
            camera.lookAt(playerPos.clone().add(direction.multiplyScalar(10)));
        }

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // ==================== MAZE GENERATION ====================
        let wallColliders = [];
        function createMaze() {
            // Floor (expanded from 200x200 to 300x300)
            const floorGeometry = new THREE.PlaneGeometry(300, 300);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ceiling
            const ceilingGeo = new THREE.PlaneGeometry(300, 300);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 12;
            ceiling.receiveShadow = true;
            scene.add(ceiling);


            // Walls (Dark Tan/Brown color)
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
            const wallH = 8;

            const wallPositions = [
                // Perimeter walls (new expanded boundaries)
                [-150, 0, 0, 300, wallH],  // West wall
                [150, 0, 0, 300, wallH],   // East wall
                [0, 0, -150, 300, wallH],  // North wall
                [0, 0, 150, 300, wallH],   // South wall
                // Internal maze walls
                [-30, 0, -40, 20, wallH], [30, 0, -40, 20, wallH],
                [-40, 0, -20, 20, wallH], [40, 0, -20, 20, wallH],
                [-30, 0, 0, 20, wallH], [30, 0, 0, 20, wallH],
                [-40, 0, 20, 20, wallH], [40, 0, 20, wallH],
                [-30, 0, 40, 20, wallH], [30, 0, 40, 20, wallH],
                [0, 0, -50, 20, wallH], [0, 0, 30, 20, wallH],
                [-50, 0, 10, 20, wallH], [50, 0, 10, 20, wallH],
                [-15, 0, -25, 15, wallH], [15, 0, -25, 15, wallH],
                [-20, 0, 15, 15, wallH], [20, 0, 15, 15, wallH]
            ];

            wallPositions.forEach(([x, y, z, w, h]) => {
                const wallGeo = new THREE.BoxGeometry(w, h, 2);
                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                wall.position.set(x, y + h / 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                wallColliders.push({ pos: new THREE.Vector3(x, y + h / 2, z), size: new THREE.Vector3(w, h, 2) });
            });
        }
        createMaze();
        createPoster();

        // ==================== SPAWN POINT & SAFE ZONE ====================
        const spawnPoint = new THREE.Vector3(0, playerHeight, 5);
        const safeZoneRadius = 8;

        // ==================== DOOR ====================
        let doorDestroyed = false;
        const doorPos = new THREE.Vector3(-55, 2.5, 0);
        let doorGroup = new THREE.Group();
        let doorMarker = null;

        function createDoor() {
            const doorGeo = new THREE.BoxGeometry(2.5, 3.5, 0.3);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x808080 });
            const doorMesh = new THREE.Mesh(doorGeo, doorMat);
            doorMesh.castShadow = true;
            doorMesh.receiveShadow = true;
            doorGroup.add(doorMesh);
            doorGroup.position.copy(doorPos);
            scene.add(doorGroup);
        }
        createDoor();

        // ==================== SQUIDS (COLLECTIBLES) ====================
        const squids = [];
        const squidPositions = [
            new THREE.Vector3(35, 1, 35),
            new THREE.Vector3(-45, 1, -45),
            new THREE.Vector3(45, 1, -35),
            new THREE.Vector3(-35, 1, 45)
        ];

        function createSquid(pos) {
            const squidGroup = new THREE.Group();

            const partGeo = new THREE.BoxGeometry(0.6, 0.4, 0.3);
            const partMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const part = new THREE.Mesh(partGeo, partMat);
            part.castShadow = true;
            part.receiveShadow = true;
            squidGroup.add(part);

            squidGroup.position.copy(pos);
            squidGroup.collected = false;
            scene.add(squidGroup);
            return squidGroup;
        }

        squidPositions.forEach(pos => {
            squids.push(createSquid(pos));
        });

        // ==================== MONKEY ENEMY ====================
        let monkeyPos = new THREE.Vector3(30, 1, -30);
        let monkeyGroup = new THREE.Group();
        let monkeyVelocity = new THREE.Vector3();
        const monkeyRadius = 0.6;

        function createMonkey() {
            // Giant squid body
            const bodyGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            monkeyGroup.add(body);

            // Giant tentacles
            for (let i = 0; i < 8; i++) {
                const tentacleCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 1.0, -1.5, Math.sin(i * Math.PI / 4) * 1.0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 1.5, -3.0, Math.sin(i * Math.PI / 4) * 1.5)
                ]);
                const tentacleGeo = new THREE.TubeGeometry(tentacleCurve, 8, 0.25, 4);
                const tentacle = new THREE.Mesh(tentacleGeo, bodyMat);
                tentacle.position.y = -0.5;
                tentacle.castShadow = true;
                monkeyGroup.add(tentacle);
            }

            // Eyes
            for (let i = -1; i <= 1; i += 2) {
                const eyeGeo = new THREE.SphereGeometry(0.3, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(i * 0.5, 1.2, 1.2);
                monkeyGroup.add(eye);
            }

            monkeyGroup.position.copy(monkeyPos);
            scene.add(monkeyGroup);
        }
        createMonkey();

        // ==================== AUDIO ====================
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Resume audio context on user interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });
        document.addEventListener('keydown', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });

        const bgMusicElement = document.getElementById('bgMusic');
        const dangerMusicElement = document.getElementById('dangerMusic');
        let currentMusicType = 'normal';

        // Auto-start game
        document.addEventListener('DOMContentLoaded', () => {
            try {
                bgMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
            } catch (e) {
                console.log('에러:', e);
            }
        });

        bgMusicElement.volume = 0.4;
        dangerMusicElement.volume = 0.4;

        function playBackgroundMusic() {
            dangerMusicElement.pause();
            dangerMusicElement.currentTime = 0;
            bgMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        function playDangerMusic() {
            bgMusicElement.pause();
            bgMusicElement.currentTime = 0;
            dangerMusicElement.play().catch(e => console.log('음악 재생 실패:', e));
        }

        // 페이지 로드 후 아무것도 하지 않음 (게임 시작 시 playBackgroundMusic 호출)
        window.addEventListener('load', () => {
            // Resume audio context on page load
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });

        function playTone(freq, duration, type = 'sine', gain = 0.3) {
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gainNode.gain.setValueAtTime(gain, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function playSwoosh() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playExplosion() {
            playSwoosh();
            playTone(150, 0.4, 'square', 0.3);
            playTone(100, 0.6, 'sine', 0.2);
        }

        function playMonkeyScream() {
            playTone(800, 0.3, 'sine', 0.4);
            playTone(600, 0.3, 'sine', 0.3);
        }

        function playFart() {
            const fartSoundElement = document.getElementById('fartSound');
            fartSoundElement.currentTime = 0;
            fartSoundElement.play().catch(e => console.log('음향 재생 실패:', e));
        }

        function playGroan() {
            playTone(120, 0.6, 'sine', 0.2);
        }

        // ==================== BOSS SYSTEM ====================
        function spawnBoss() {
            if (bossMonkey) return;

            // Create boss (reuse monkey mesh structure)
            const bodyGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
            bossMonkey = new THREE.Group();

            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            bossMonkey.add(body);

            for (let i = 0; i < 8; i++) {
                const tentacleCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 1.0, -1.5, Math.sin(i * Math.PI / 4) * 1.0),
                    new THREE.Vector3(Math.cos(i * Math.PI / 4) * 1.5, -3.0, Math.sin(i * Math.PI / 4) * 1.5)
                ]);
                const tentacleGeo = new THREE.TubeGeometry(tentacleCurve, 8, 0.25, 4);
                const tentacle = new THREE.Mesh(tentacleGeo, bodyMat);
                tentacle.position.y = -0.5;
                tentacle.castShadow = true;
                bossMonkey.add(tentacle);
            }

            for (let i = -1; i <= 1; i += 2) {
                const eyeGeo = new THREE.SphereGeometry(0.3, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(i * 0.5, 1.2, 1.2);
                bossMonkey.add(eye);
            }

            bossMonkey.position.set(0, 50, 0);
            scene.add(bossMonkey);
            gameState.bossActive = true;
            gameState.bossHealth = 20;
            document.getElementById('bossHealthBar').classList.add('show');

            // Teleport player to spawn
            playerPos.copy(spawnPoint);
            camera.position.copy(playerPos);
        }

        function bossDeath() {
            const bossDieElement = document.getElementById('bossDieSound');
            bossDieElement.currentTime = 0;
            bossDieElement.play().catch(e => console.log('음향 재생 실패:', e));

            if (bossMonkey) scene.remove(bossMonkey);
            bossMonkey = null;
            gameState.bossActive = false;

            // Create real key
            if (!realKey) {
                const keyGeo = new THREE.BoxGeometry(0.8, 1.5, 0.4);
                const keyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.5 });
                realKey = new THREE.Mesh(keyGeo, keyMat);
                realKey.position.set(0, 3, 0);
                realKey.castShadow = true;
                realKey.receiveShadow = true;
                scene.add(realKey);
            }

            document.getElementById('bossHealthBar').classList.remove('show');
        }

        function activateDash() {
            gameState.dashActive = true;
            gameState.dashEndTime = Date.now() + 500;
            gameState.dashCooldown = gameState.dashMaxCooldown;
            dashDamaged = false;

            const dashElement = document.getElementById('dashSound');
            dashElement.currentTime = 0;
            dashElement.play().catch(e => console.log('음향 재생 실패:', e));
        }

        function handleParry(enemy) {
            const parryElement = document.getElementById('parrySound');
            parryElement.currentTime = 0;
            parryElement.play().catch(e => console.log('음향 재생 실패:', e));

            // Get dash direction
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            // Push player back
            playerPos.addScaledVector(direction, -0.3);

            // Push enemy back
            const enemyDir = new THREE.Vector3().subVectors(enemy, playerPos).normalize();
            enemy.addScaledVector(enemyDir, 2.0);

            // Stun enemy for 2 seconds
            monkeyMonkeyStunnedUntil = Date.now() + 2000;
        }

        function startCredits() {
            gameState.gamePhase = 'credits';
            gameState.creditsActive = true;

            const creditsScreen = document.getElementById('creditsScreen');
            const creditsText = document.getElementById('creditsText');
            creditsText.textContent = '이승준\n방지율 (김종민)\nClaude AI\n\nTHANKS 4 PLAYING';
            creditsScreen.classList.add('show');

            setTimeout(() => {
                showExplosion();
            }, 4500);
        }

        function showExplosion() {
            const explosionScreen = document.getElementById('explosionScreen');
            const explosionContent = document.getElementById('explosionContent');

            let explosionText = '';
            for (let i = 0; i < 200; i++) {
                explosionText += '💥';
                if (i % 10 === 9) explosionText += '<br>';
            }
            explosionContent.innerHTML = explosionText;

            explosionScreen.classList.add('show');

            const explosionElement = document.getElementById('explosionSound');
            explosionElement.currentTime = 0;
            explosionElement.play().catch(e => console.log('음향 재생 실패:', e));

            setTimeout(() => {
                try {
                    window.close();
                } catch (e) {
                    alert('GAME OVER! Thanks for Playing!');
                }
            }, 2000);
        }

        function createPoster() {
            if (posterWall) return;

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('Flowery_Refsheet.webp', (texture) => {
                const geometry = new THREE.PlaneGeometry(2, 3);
                const material = new THREE.MeshStandardMaterial({ map: texture });
                posterWall = new THREE.Mesh(geometry, material);
                posterWall.position.set(-140, 4, -140);
                posterWall.rotation.y = Math.PI / 4;
                posterWall.castShadow = true;
                scene.add(posterWall);
            }).catch(() => {
                // Fallback: create colored plane if texture fails
                const geometry = new THREE.PlaneGeometry(2, 3);
                const material = new THREE.MeshStandardMaterial({ color: 0xFF1493 });
                posterWall = new THREE.Mesh(geometry, material);
                posterWall.position.set(-140, 4, -140);
                posterWall.rotation.y = Math.PI / 4;
                posterWall.castShadow = true;
                scene.add(posterWall);
            });
        }

        // ==================== MESSAGE SYSTEM ====================
        function showMessage(text, duration, color) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.textContent = text;
            messageDiv.style.color = color;
            document.getElementById('messageOverlay').appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, duration + 800);
        }

        // ==================== GUN SYSTEM ====================
        function fireGun() {
            if (gameState.gunCooldown > 0) return;

            const gunShotElement = document.getElementById('gunShotSound');
            gunShotElement.currentTime = 0;
            gunShotElement.play().catch(e => console.log('음향 재생 실패:', e));

            gameState.gunCooldown = 0.1;

            // Ray casting from camera
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            const rayOrigin = camera.position.clone();
            const rayDistance = 100;
            const rayEnd = rayOrigin.clone().addScaledVector(direction, rayDistance);

            // Check boss first if boss is active
            if (gameState.bossActive && !gameState.bossInvulnerable) {
                const hitDistance = rayOrigin.distanceTo(bossMonkey.position);
                const rayToBoss = new THREE.Vector3().subVectors(bossMonkey.position, rayOrigin);
                const angle = rayToBoss.angleTo(direction);

                if (angle < 0.3 && hitDistance < rayDistance) {
                    gameState.bossHealth--;
                    gameState.bossInvulnerable = true;
                    gameState.bossInvulnerableUntil = Date.now() + 500;

                    // Flash white
                    const originalColor = bossMonkey.children[0].material.color.getHex();
                    bossMonkey.children[0].material.color.set(0xffffff);
                    setTimeout(() => {
                        bossMonkey.children[0].material.color.setHex(originalColor);
                    }, 250);

                    // Update health bar
                    const healthPercent = (gameState.bossHealth / 20) * 100;
                    document.getElementById('bossHealthFill').style.width = healthPercent + '%';
                    document.getElementById('bossHealthText').textContent = `BOSS: ${gameState.bossHealth}/20`;

                    if (gameState.bossHealth <= 0) {
                        bossDeath();
                    }
                    return;
                }
            }

            // Check squid if squid not defeated
            if (!gameState.squidDefeated && gameState.assaultModeActive) return;

            const distToMonkey = playerPos.distanceTo(monkeyPos);
            const hitDistance = rayOrigin.distanceTo(monkeyPos);
            const rayToMonkey = new THREE.Vector3().subVectors(monkeyPos, rayOrigin);
            const angle = rayToMonkey.angleTo(direction);

            // Hit if within cone angle and within rayDistance
            if (angle < 0.3 && hitDistance < rayDistance) {
                squidsDefeated();
            }
        }

        function squidsDefeated() {
            const deathElement = document.getElementById('deathSound');
            deathElement.currentTime = 0;
            deathElement.play().catch(e => console.log('음향 재생 실패:', e));

            gameState.squidDefeated = true;
            gameState.squidRagdollState = 'falling';
            gameState.assaultModeActive = true;

            // Create key at squid position
            createKey();

            // Play assault music
            playAssaultMode();
        }

        function createKey() {
            if (keyObject) return;

            const keyGeo = new THREE.BoxGeometry(0.4, 0.8, 0.2);
            const keyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.3 });
            keyObject = new THREE.Mesh(keyGeo, keyMat);
            keyObject.position.copy(monkeyPos);
            keyObject.position.y = 2;
            keyObject.castShadow = true;
            keyObject.receiveShadow = true;
            scene.add(keyObject);
        }

        function playAssaultMode() {
            bgMusicElement.pause();
            bgMusicElement.currentTime = 0;
            dangerMusicElement.pause();
            dangerMusicElement.currentTime = 0;

            const assaultElement = document.getElementById('assaultMusic');
            assaultElement.volume = 0.4;
            assaultElement.currentTime = 0;
            assaultElement.play().catch(e => console.log('음향 재생 실패:', e));

            currentMusicType = 'assault';
            difficultyMultiplier = difficultySettings[gameState.difficulty];
        }

        function startIntroSequence() {
            const introScreen = document.getElementById('introScreen');
            introScreen.classList.add('hidden');
            gameState.gameStarted = true;
            currentMusicType = 'normal';
        }

        // ==================== INTRO SCREEN EVENT LISTENERS ====================
        const difficultyButtons = document.querySelectorAll('.difficulty-button');
        const startButton = document.getElementById('startButton');
        const gunUI = document.getElementById('gunUI');

        // Set default difficulty to easy and enable start button
        gameState.difficulty = 'easy';
        startButton.disabled = false;

        difficultyButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                difficultyButtons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                gameState.difficulty = e.target.dataset.difficulty;
            });

            // Highlight default selection
            if (button.dataset.difficulty === 'easy') {
                button.classList.add('active');
            }
        });

        startButton.addEventListener('click', startIntroSequence);

        gunUI.addEventListener('click', () => {
            if (gameState.gunUnlocked && !gameState.gameEnded) {
                fireGun();
            }
        });

        // ==================== SKILL SYSTEM ====================
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f' && gameState.skillCooldown <= 0 && !gameState.gameEnded && gameState.gameStarted) {
                playExplosion();
                playFart();
                setTimeout(playGroan, 400);

                gameState.skillCooldown = gameState.skillMaxCooldown;

                // Stun nearby monkey
                const distToMonkey = playerPos.distanceTo(monkeyPos);
                if (distToMonkey < 20) {
                    gameState.monkeyStunned = true;
                    gameState.monkeyStubbedUntil = Date.now() + 6000;
                    playMonkeyScream();
                }
            } else if (e.key.toLowerCase() === 'r' && !gameState.gameEnded && gameState.gameStarted && gameState.skillRCooldown <= 0) {
                const raahSoundElement = document.getElementById('raahSound');
                raahSoundElement.currentTime = 0;
                raahSoundElement.play().catch(e => console.log('음향 재생 실패:', e));

                gameState.speedBoostActive = true;
                gameState.speedBoostUntil = Date.now() + 3000;
                gameState.skillRCooldown = gameState.skillRMaxCooldown;
            } else if (e.key.toLowerCase() === 's' && !gameState.gameEnded && gameState.gameStarted && gameState.dashUnlocked && gameState.dashCooldown <= 0) {
                activateDash();
            }
        });

        // ==================== GAME LOOP ====================
        function animate() {
            requestAnimationFrame(animate);

            // Game not started yet
            if (!gameState.gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            // Update camera rotation
            updateCameraRotation();

            // Update cooldowns
            if (gameState.skillCooldown > 0) {
                gameState.skillCooldown -= 0.016;
            }
            if (gameState.skillRCooldown > 0) {
                gameState.skillRCooldown -= 0.016;
            }
            if (gameState.gunCooldown > 0) {
                gameState.gunCooldown -= 0.016;
            }
            if (gameState.dashCooldown > 0) {
                gameState.dashCooldown -= 0.016;
            }

            // Update UI
            document.getElementById('squidCount').textContent = `권총 부품: ${gameState.squidCount}/4`;

            // Check gun unlock
            if (gameState.squidCount === 4 && !gameState.gunUnlocked) {
                gameState.gunUnlocked = true;
                document.getElementById('gunUI').classList.add('visible');
                showMessage('전설의 무기를 완성했다', 2000, '#ff0000');
            }

            let skillText = '';
            if (gameState.skillCooldown <= 0) {
                skillText += '방구 준비됨 (F)  ';
            } else {
                skillText += `방구 ${gameState.skillCooldown.toFixed(1)}s  `;
            }

            if (gameState.skillRCooldown <= 0) {
                skillText += '속도 준비됨 (R)  ';
            } else {
                skillText += `속도 ${gameState.skillRCooldown.toFixed(1)}s  `;
            }

            if (gameState.dashUnlocked) {
                if (gameState.dashCooldown <= 0) {
                    skillText += '대쉬 준비됨 (S)';
                } else {
                    skillText += `대쉬 ${gameState.dashCooldown.toFixed(1)}s`;
                }
            }

            document.getElementById('skillCooldown').textContent = skillText;
            document.getElementById('skillCooldown').style.color = '#ffff00';

            // Check stun status
            if (gameState.monkeyStunned && Date.now() > gameState.monkeyStubbedUntil) {
                gameState.monkeyStunned = false;
            }

            // Check speed boost status
            if (gameState.speedBoostActive && Date.now() > gameState.speedBoostUntil) {
                gameState.speedBoostActive = false;
            }

            // Check boss invulnerability
            if (gameState.bossInvulnerable && Date.now() > gameState.bossInvulnerableUntil) {
                gameState.bossInvulnerable = false;
            }

            // Check monster stun (for parry)
            if (monkeyMonkeyStunnedUntil > 0 && Date.now() > monkeyMonkeyStunnedUntil) {
                monkeyMonkeyStunnedUntil = 0;
            }

            // Check dash active
            if (gameState.dashActive && Date.now() > gameState.dashEndTime) {
                gameState.dashActive = false;
            }

            // Poster collision (unlock dash)
            if (!gameState.dashUnlocked && posterWall) {
                const distToPoster = playerPos.distanceTo(posterWall.position);
                if (distToPoster < 2) {
                    gameState.dashUnlocked = true;
                    showMessage('대쉬를 배웠다!', 1500, '#00ff00');
                }
            }

            // Squid ragdoll physics
            if (gameState.squidRagdollState === 'falling') {
                monkeyPos.y -= 0.15;
                if (monkeyPos.y <= 1) {
                    monkeyPos.y = 1;
                    gameState.squidRagdollState = 'landed';
                }
            }

            // Squid collection
            squids.forEach((squid, idx) => {
                if (!squid.collected) {
                    squid.rotation.y += 0.02;
                    squid.position.y += Math.sin(Date.now() * 0.003) * 0.01;

                    const distToPlayer = playerPos.distanceTo(squid.position);
                    if (distToPlayer < 3) {
                        squid.collected = true;
                        gameState.squidCount++;
                        scene.remove(squid);
                    }
                }
            });

            // Key collection (first key -> boss fight)
            if (keyObject && !gameState.gameEnded && !gameState.bossActive) {
                keyObject.rotation.y += 0.03;
                const distToKey = playerPos.distanceTo(keyObject.position);
                if (distToKey < 3) {
                    scene.remove(keyObject);
                    keyObject = null;
                    gameState.gamePhase = 'boss';
                    spawnBoss();
                }
            }

            // Real key collection (final)
            if (realKey && !gameState.gameEnded) {
                realKey.rotation.y += 0.03;
                const distToKey = playerPos.distanceTo(realKey.position);
                if (distToKey < 3) {
                    gameState.gameEnded = true;
                    scene.remove(realKey);
                    realKey = null;
                    startCredits();
                }
            }

            // Dash physics
            if (gameState.dashActive) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                playerPos.addScaledVector(direction, 0.5);

                // Check collision with squid during dash
                if (!gameState.squidDefeated) {
                    const distToMonkey = playerPos.distanceTo(monkeyPos);
                    if (distToMonkey < 2.5 && !dashDamaged) {
                        dashDamaged = true;
                        handleParry(monkeyPos);
                    }
                }

                // Check collision with boss during dash
                if (gameState.bossActive && bossMonkey && !dashDamaged) {
                    const distToBoss = playerPos.distanceTo(bossMonkey.position);
                    if (distToBoss < 2.5) {
                        dashDamaged = true;
                        handleParry(bossMonkey.position);
                    }
                }
            }

            // Monkey AI (squid)
            if (gameState.squidRagdollState !== 'falling' && gameState.squidRagdollState !== 'landed') {
                if (!gameState.monkeyStunned && monkeyMonkeyStunnedUntil === 0) {
                    const dirToPlayer = new THREE.Vector3();
                    dirToPlayer.subVectors(playerPos, monkeyPos).normalize();
                    let speed = 0.12;
                    if (gameState.assaultModeActive) {
                        speed *= (1 + (difficultyMultiplier - 1) * 2);
                    }
                    monkeyVelocity.copy(dirToPlayer).multiplyScalar(speed);
                } else {
                    monkeyVelocity.multiplyScalar(0.95);
                }
            } else if (gameState.squidRagdollState === 'landed') {
                monkeyVelocity.multiplyScalar(0.9);
            }

            // Boss AI (if boss is active)
            if (gameState.bossActive && bossMonkey) {
                if (monkeyMonkeyStunnedUntil === 0) {
                    const dirToPlayer = new THREE.Vector3();
                    dirToPlayer.subVectors(playerPos, bossMonkey.position).normalize();
                    const bossSpeed = 0.2 * (1 + (difficultyMultiplier - 1) * 3);
                    bossMonkey.position.addScaledVector(dirToPlayer, bossSpeed);
                } else {
                    // Stun: no movement
                }
                bossMonkey.position.y = Math.max(bossMonkey.position.y, 1);
            }

            const newMonkeyPos = monkeyPos.clone().add(monkeyVelocity);
            let canMove = true;
            for (let wall of wallColliders) {
                const dx = Math.abs(newMonkeyPos.x - wall.pos.x);
                const dz = Math.abs(newMonkeyPos.z - wall.pos.z);
                if (dx < wall.size.x / 2 + monkeyRadius && dz < wall.size.z / 2 + monkeyRadius) {
                    canMove = false;
                    break;
                }
            }

            if (canMove) {
                monkeyPos.add(monkeyVelocity);
            }

            monkeyPos.y = 1;
            monkeyGroup.position.copy(monkeyPos);

            // Make monkey look at player
            const dirToPlayerForLook = playerPos.clone().sub(monkeyPos);
            monkeyGroup.lookAt(monkeyPos.clone().add(dirToPlayerForLook));

            // Collision with monkey (squid)
            if (!gameState.squidDefeated) {
                const distToMonkey = playerPos.distanceTo(monkeyPos);
                if (distToMonkey < 2) {
                    playerPos.copy(spawnPoint);
                    camera.position.copy(playerPos);
                }
            }

            // Collision with boss
            if (gameState.bossActive && bossMonkey) {
                const distToBoss = playerPos.distanceTo(bossMonkey.position);
                if (distToBoss < 2) {
                    playerPos.copy(spawnPoint);
                    camera.position.copy(playerPos);
                }
            }

            // Safe zone (can't take damage here)
            const distToSpawn = playerPos.distanceTo(spawnPoint);
            if (distToSpawn < safeZoneRadius && distToMonkey < 2) {
                // Monkey bounces back
                const bounceDir = new THREE.Vector3();
                bounceDir.subVectors(monkeyPos, playerPos).normalize();
                monkeyPos.addScaledVector(bounceDir, 3);
            }

            // Door marker removed - key system replaces this

            // Door marker (removed - key system replaces this)

            // Update music based on threat level (unless assault mode is active)
            if (!gameState.assaultModeActive) {
                const monkeyDist = playerPos.distanceTo(monkeyPos);
                const isInDanger = monkeyDist < 25 && distToSpawn > safeZoneRadius;

                if (isInDanger && currentMusicType === 'normal') {
                    currentMusicType = 'danger';
                    playDangerMusic();
                } else if (!isInDanger && currentMusicType === 'danger') {
                    currentMusicType = 'normal';
                    playBackgroundMusic();
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
